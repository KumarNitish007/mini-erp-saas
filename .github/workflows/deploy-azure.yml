# Manual deployment to Azure App Service (API + Angular in one site).
# Requires repository secrets for OIDC login: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
# and a repository variable AZURE_WEBAPP_NAME (output of infra/main.bicep).
name: Deploy to Azure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Angular
        working-directory: src/frontend
        run: |
          npm ci
          npx ng build --configuration production

      - name: Publish API with the SPA in wwwroot
        run: |
          dotnet publish src/backend/MiniErp.Api -c Release -o publish
          mkdir -p publish/wwwroot
          cp -r src/frontend/dist/web/browser/* publish/wwwroot/

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish
