<mat-sidenav-container class="shell">
  <mat-sidenav #drawer class="sidenav" [mode]="isHandset() ? 'over' : 'side'" [opened]="!isHandset()">
    <div class="brand">
      <span class="brand-mark">M</span>
      <div>
        <div class="brand-name">MiniERP</div>
        <div class="brand-tenant" [matTooltip]="auth.user()?.tenantName ?? ''">{{ auth.user()?.tenantName }}</div>
      </div>
    </div>

    <mat-nav-list>
      @for (item of nav(); track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive="active-link" #rla="routerLinkActive"
           [activated]="rla.isActive" (click)="isHandset() && drawer.close()">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <div class="sidenav-footer">
      <a mat-flat-button routerLink="/invoices/new" class="full-width" (click)="isHandset() && drawer.close()">
        <mat-icon>add</mat-icon> New invoice
      </a>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      @if (isHandset()) {
        <button mat-icon-button (click)="drawer.toggle()" aria-label="Toggle navigation"><mat-icon>menu</mat-icon></button>
      }
      <span class="spacer"></span>
      <button mat-icon-button (click)="toggleTheme()" [matTooltip]="dark() ? 'Light mode' : 'Dark mode'" aria-label="Toggle theme">
        <mat-icon>{{ dark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-button">
        <span class="avatar">{{ initials() }}</span>
        <span class="user-name">{{ auth.user()?.fullName }}</span>
      </button>
      <mat-menu #userMenu="matMenu" xPosition="before">
        <div class="menu-header">
          <strong>{{ auth.user()?.fullName }}</strong>
          <small>{{ auth.user()?.email }} · {{ auth.user()?.role }}</small>
        </div>
        <button mat-menu-item (click)="auth.logout()"><mat-icon>logout</mat-icon> Sign out</button>
      </mat-menu>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
